// Build a silent, single-track MP4. Each encoded sample is a one-second IDR frame.
function countdownMovie(samples, config, width, height) {
  const bytes = (...values) => Uint8Array.of(...values);
  const word = n => bytes(n >>> 8, n);
  const long = n => bytes(n >>> 24, n >>> 16, n >>> 8, n);
  const zeros = n => new Uint8Array(n);
  const str = s => new TextEncoder().encode(s);
  function join(...parts) {
    const result = new Uint8Array(parts.reduce((sum, p) => sum + p.length, 0));
    let offset = 0;
    for (const part of parts) { result.set(part, offset); offset += part.length; }
    return result;
  }
  const box = (type, ...parts) => join(long(8 + parts.reduce((sum,p)=>sum+p.length,0)), str(type), ...parts);
  const full = (type, flags, ...parts) => box(type,long(flags),...parts);
  const matrix = join(...[65536,0,0,0,65536,0,0,0,1073741824].map(long));
  const fileType = box('ftyp',str('isom'),long(512),str('isomiso2avc1mp41'));
  const duration = long(samples.length);
  const clock = join(zeros(8),long(1),duration);
  const movieHeader = full('mvhd',0,clock,long(65536),word(256),zeros(10),matrix,zeros(24),long(2));
  const trackHeader = full('tkhd',7,zeros(8),long(1),zeros(4),duration,zeros(16),matrix,long(width*65536),long(height*65536));
  const description = box('avc1',zeros(6),word(1),zeros(16),word(width),word(height),long(72*65536),long(72*65536),zeros(4),word(1),zeros(32),word(24),word(65535),box('avcC',config));
  const sizeTable = new Uint8Array(samples.length * 4);
  const sizes = new DataView(sizeTable.buffer);
  samples.forEach((s,i)=>sizes.setUint32(i*4,s.length));
  const table = box('stbl',full('stsd',0,long(1),description),
    full('stts',0,long(1),duration,long(1)),full('stsc',0,long(1),long(1),duration,long(1)),
    full('stsz',0,long(0),duration,sizeTable),full('stco',0,long(1),long(fileType.length+8)));
  const info = box('minf',full('vmhd',1,zeros(8)),box('dinf',full('dref',0,long(1),full('url ',1))),table);
  const media = box('mdia',full('mdhd',0,clock,word(21956),word(0)),full('hdlr',0,long(0),str('vide'),zeros(12),str('Cadence\0')),info);
  const movie = box('moov',movieHeader,box('trak',trackHeader,media));
  const dataSize = samples.reduce((sum,s)=>sum+s.length,0);
  return new Blob([fileType,long(dataSize+8),str('mdat'),...samples,movie],{type:'video/mp4'});
}
const video=$('#video');

function miniButton(label, disabled=false) {
  const b=app.querySelector('[data-action="float"]');
  if(b){b.innerHTML=pipIcon+(label==='Float timer'?'':'<span>'+safe(label)+'</span>');b.setAttribute('aria-label',label);b.disabled=disabled}
}
function mediaAudio(){

}
function cleanMini(){
  miniToken++; preparing=false; miniReady=false;
  if(document.pictureInPictureElement===video)document.exitPictureInPicture().catch(()=>{});
  if(video.webkitPresentationMode==='picture-in-picture')try{video.webkitSetPresentationMode('inline')}catch{}
  stream?.getTracks().forEach(t=>t.stop());stream=null;canvas=null;
  video.pause();video.srcObject=null;video.removeAttribute('src');video.load();
  if(movieURL)URL.revokeObjectURL(movieURL);movieURL='';
}
async function encodeMovie(token) {
  if(!window.VideoEncoder || !window.VideoFrame || list.at(-1).end>7200)return null;
  const settings={codec:'avc1.42E01E',width:400,height:240,framerate:1,bitrate:160000,latencyMode:'realtime',avc:{format:'avc'}};
  if(!(await VideoEncoder.isConfigSupported(settings)).supported)return null;
  const surface=document.createElement('canvas');surface.width=400;surface.height=240;
  const samples=[]; let config,error,bytes=0;
  const encoder=new VideoEncoder({error:e=>{error=e},output:(chunk,meta)=>{
    if(meta?.decoderConfig?.description)config=new Uint8Array(meta.decoderConfig.description);
    const data=new Uint8Array(chunk.byteLength);chunk.copyTo(data);samples.push(data);bytes+=data.length;
  }});
  try {
    encoder.configure(settings);
    const end=list.at(-1).end;
    for(let t=0;t<end;t++){
      if(token!==miniToken)throw Error('Workout changed');
      const p=list[locate(t)];draw(p,p.end-t,surface,p.phase);
      const frame=new VideoFrame(surface,{timestamp:t*1000000,duration:1000000});
      try{encoder.encode(frame,{keyFrame:true})}finally{frame.close()}
      if(t%24===23){await encoder.flush();await new Promise(r=>setTimeout(r,0));if(error)throw error;if(bytes>24000000)return null}
    }
    await encoder.flush();if(error)throw error;
    return config&&samples.length===end?countdownMovie(samples,config,400,240):null;
  }finally{if(encoder.state!=='closed')encoder.close()}
}
function syncMovie(){
  if(!movieURL||!miniReady||!session)return;
  if(Math.abs(video.currentTime-elapsed())>.35)video.currentTime=Math.min(elapsed(),video.duration||elapsed());
  if(session.since===null)video.pause();else video.play().catch(()=>{});
}
async function prepareMini(){
  const token=++miniToken;preparing=true;miniButton('Preparing timer video…',true);
  try{
    let blob;
    try{blob=await encodeMovie(token)}catch{blob=null}
    if(token!==miniToken)return;
    if(blob){movieURL=URL.createObjectURL(blob);video.src=movieURL}
    else{
      canvas=document.createElement('canvas');canvas.width=400;canvas.height=240;
      if(!canvas.captureStream)throw Error('This browser cannot create a timer video.');
      stream=canvas.captureStream(10);video.srcObject=stream;tick();
    }
    await Promise.race([video.play(),new Promise((_,no)=>setTimeout(()=>no(Error('Video playback did not start.')),8000))]);
    if(token!==miniToken)return;
    miniReady=true;syncMovie();miniButton('Open floating timer');say('Video ready. Tap Open floating timer.');
  }catch(e){if(token===miniToken){cleanMini();miniButton('Float timer');say('Video setup failed: '+(e.name==='Error'?e.message:e.name))}}
  finally{if(token===miniToken)preparing=false}
}
async function float(){
  if(preparing)return;
  if(session.since===null){say('Resume the workout to float the countdown.');return}
  if(!miniReady){await prepareMini();return}
  try{
    syncMovie();
    if(video.webkitSupportsPresentationMode?.('picture-in-picture'))video.webkitSetPresentationMode('picture-in-picture');
    else if(document.pictureInPictureEnabled&&video.requestPictureInPicture)await video.requestPictureInPicture();
    else throw Error('This browser did not offer Picture in Picture for the timer video.');
  }catch(e){
    const standalone = navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
    const appleMobile = navigator.standalone === true || /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (standalone && appleMobile && (e.name === 'NotSupportedError' || e.message === 'This browser did not offer Picture in Picture for the timer video.')) {
      let help = app.querySelector('#pip-help');
      if (!help) {
        help = document.createElement('p');
        help.id = 'pip-help';
        help.setAttribute('role', 'status');
        app.querySelector('footer').before(help);
      }
      help.textContent = 'This iPhone declined PiP from the Home Screen app. Start Cadence in your browser for a floating timer. On iOS 26, use Add to Home Screen with “Open as Web App” switched off for a browser shortcut.';
    } else {
      say(e.name==='Error'?e.message:'Picture in Picture was declined ('+e.name+').');
    }
  }
}
